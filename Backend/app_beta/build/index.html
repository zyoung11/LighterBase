<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backend Application</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #f0f0f0;
    }

    .container {
      text-align: center;
      padding: 2rem;
      background: white;
      border-radius: 10px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    h1 {
      color: #333;
    }

    .status {
      color: #4CAF50;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>LighterBase</h1>
    <p>Server is running on port <span class="status">8080</span></p>
    <p>API endpoints are available at <code>/api/*</code></p>
    <p>Try visiting <a href="/health">/health</a> to check server status</p>
  </div>
</body>

</html>
