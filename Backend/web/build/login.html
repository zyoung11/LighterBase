<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./LOGOW-z7cg21xb.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      /* 增加渐变效果，更平滑 */
    }
  </style>
  
<script type="module" crossorigin src="./login-yps5am9d.js"></script></head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col">


  <!-- 中间内容 -->
  <div class="flex-1 flex overflow-hidden">
    <!-- 左侧 70%：品牌区 -->
    <section class="w-[70%] flex items-center justify-center relative"
      style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">
      <!-- 中央文案 -->
      <h1 class="text-3xl font-semibold tracking-wide select-none">
        欢迎使用 LighterBase
      </h1>
    </section>

    <!-- 右侧 30%：登录区 -->
    <aside class="w-[30%] bg-[#181A1B] flex items-center justify-center p-8 shadow-2xl">
      <div class="w-full max-sm:max-w-sm">

        <!-- 切换按钮 -->
        <div class="flex justify-center mb-6 w-full">
          <button id="toggle-login"
            class="w-[50%] px-2 py-2 bg-[#46A3FF] text-white rounded-l-lg transition-colors">登录</button>
          <button id="toggle-register"
            class="w-[50%] px-2 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] text-gray-200 rounded-r-lg transition-colors">注册</button>
        </div>

        <!-- 表单 -->
        <form id="auth-form" novalidate class="space-y-4">
          <div>
            <label class="block mb-1 text-sm">用户名</label>
            <input required id="username" type="text" placeholder="请输入用户名"
              class="w-full px-3 py-2 rounded bg-[#2B2F31] border border-[#2B2F31] focus:border-[#4a4f52] focus:outline-none" />
          </div>
          <div>
            <label class="block mb-1 text-sm">密码</label>
            <input required id="password" type="password" placeholder="请输入密码"
              class="w-full px-3 py-2 rounded bg-[#2B2F31] border border-[#2B2F31] focus:border-[#4a4f52] focus:outline-none" />
          </div>
          <div id="email-field" class="hidden">
            <label class="block mb-1 text-sm">邮箱</label>
            <input required id="email" type="email" placeholder="请输入邮箱"
              class="w-full px-3 py-2 rounded bg-[#2B2F31] border border-[#2B2F31] focus:border-[#4a4f52] focus:outline-none" />
          </div>
          <button type="submit" id="submit-btn"
            class="w-full py-2 mt-2 rounded bg-[#2B2F31] hover:bg-[#3a3f41] transition-colors">
            登录
          </button>
        </form>

      </div>
    </aside>
  </div>
  <div class="absolute bottom-4 flex items-center left-4">
    <img src="./LOGOW-z7cg21xb.png" alt="GitHub" class="w-12 h-12">
    <div class="font-bold">LighterBase</div>
  </div>
  
  
</body>

</html>
