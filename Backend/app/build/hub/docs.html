<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/LOGOW.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col">
  <!-- 顶部导航栏 -->
  <nav class="flex justify-between items-center px-6 py-2 bg-[#181A1B]">
    <!-- 左侧：Logo、名称、Pricing、Docs -->
    <div class="flex items-center space-x-4">
      <a href="hub" class="flex items-center space-x-3">
        <img src="../icons/LOGOW.png" alt="Logo" class="w-8 h-8">
        <span class="text-xl font-bold">LighterBase</span>
      </a>
      <a href="pricing"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors inline-block">Pricing</a>
      <a href="docs"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors inline-block">Docs</a>
    </div>
    <!-- 右侧：Login in 或 用户名 -->
    <div class="relative">
      <a id="user-link" href="login"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] text-[#46A3FF] rounded-lg transition-colors inline-block">Login
        in</a>
      <div id="logout-menu" class="absolute top-full mt-1 bg-[#2B2F31] rounded-lg shadow-lg hidden z-10">
        <button id="logout-btn" class="px-4 py-2 text-white hover:bg-[#3a3f41] rounded-lg w-16 text-center">登出</button>
      </div>
    </div>
  </nav>

  <!-- 中间内容 -->
  <div class="flex-1 flex overflow-hidden">
    <!-- 左侧侧边栏 -->
    <aside class="w-1/4 bg-[#181A1B] p-4 overflow-y-auto">
      <h3 class="text-lg font-semibold mb-4">章节</h3>
      <ul class="space-y-2">
        <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded" data-section="intro">介绍</a></li>
        <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded" data-section="getting-started">入门</a>
        </li>
        <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded" data-section="api-reference">API 参考</a></li>
        <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded" data-section="tutorials">教程</a></li>
      </ul>
    </aside>

    <!-- 中间显示区域 -->
    <main class="flex-1 overflow-y-auto p-8 relative">
      <div id="content">
        <section id="intro" class="content-section">
          <div id="intro-cont"></div>
        </section>
        <section id="getting-started" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">入门</h2>
          <p class="mb-4">学习如何设置您的第一个数据库并开始构建应用程序。</p>
          <p>更多详情在这里...</p>
        </section>
        <section id="api-reference" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">API 参考</h2>
          <p class="mb-4">面向开发者的详细 API 文档。</p>
          <p>更多详情在这里...</p>
        </section>
        <section id="tutorials" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">教程</h2>
          <p>常见任务的分步指南。</p>
          <p>更多详情在这里...</p>
        </section>
      </div>
      <!-- 底部导航按钮 -->
      <div class="absolute bottom-0 left-0 right-0 flex justify-between items-center px-6 py-4 bg-[#181A1B]">
        <button id="prev-btn"
          class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors">上一页</button>
        <button id="next-btn"
          class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors">下一页</button>
      </div>
    </main>

    <!-- 右侧跳转栏 -->
    <aside class="w-1/4 bg-[#181A1B] p-4 overflow-y-auto">
      <h3 class="text-lg font-semibold mb-4">跳转到</h3>
      <ul class="space-y-2">
        <li><a href="#intro" class="block p-2 hover:bg-[#2B2F31] rounded">介绍</a></li>
        <li><a href="#getting-started" class="block p-2 hover:bg-[#2B2F31] rounded">入门</a></li>
        <li><a href="#api-reference" class="block p-2 hover:bg-[#2B2F31] rounded">API 参考</a></li>
        <li><a href="#tutorials" class="block p-2 hover:bg-[#2B2F31] rounded">教程</a></li>
      </ul>
    </aside>
  </div>


  <script src="../utils/hubDoc.js"></script>
  <script>
    const sections = ['intro', 'getting-started', 'api-reference', 'tutorials'];
    let currentSection = 'intro';

    function showSection(sectionId) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
      currentSection = sectionId;
    }

    // 侧边栏点击
    document.querySelectorAll('aside:first-of-type a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const section = e.target.dataset.section;
        showSection(section);
      });
    });

    // 跳转栏点击
    document.querySelectorAll('aside:last-of-type a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = e.target.getAttribute('href').substring(1);
        const main = document.querySelector('main');
        const element = document.getElementById(target);
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      });
    });

    // 上一页
    document.getElementById('prev-btn').addEventListener('click', () => {
      const index = sections.indexOf(currentSection);
      if (index > 0) {
        showSection(sections[index - 1]);
      }
    });

    // 下一页
    document.getElementById('next-btn').addEventListener('click', () => {
      const index = sections.indexOf(currentSection);
      if (index < sections.length - 1) {
        showSection(sections[index + 1]);
      }
    });

    // 初始化显示 intro
    showSection('intro');
  </script>
  <script>
    // 检查登录状态
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    const token = getCookie('hubAuthToken');
    const username = localStorage.getItem('username');
    const userLink = document.getElementById('user-link');
    const logoutMenu = document.getElementById('logout-menu');
    const logoutBtn = document.getElementById('logout-btn');

    if (token && username) {
      userLink.textContent = username;
      userLink.href = '#';

      // 点击用户名显示/隐藏登出菜单
      userLink.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        logoutMenu.classList.toggle('hidden');
      });

      // 点击登出清除token
      logoutBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        document.cookie = 'hubAuthToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT;';
        localStorage.removeItem('username');
        window.location.reload();
      });

      // 点击其他地方隐藏菜单
      document.addEventListener('click', function (e) {
        if (!userLink.contains(e.target) && !logoutMenu.contains(e.target)) {
          logoutMenu.classList.add('hidden');
        }
      });
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';
      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }
    });
  </script>

</body>

</html>
