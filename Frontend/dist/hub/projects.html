<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../LOGOW-z7cg21xb.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  
<script type="module" crossorigin src="../projects-yamb69sy.js"></script></head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">

  <div id="app" class="overflow-y-auto">
    <!-- Grid container will be generated here -->
  </div>





  <!-- 底部栏 -->
  <div class="fixed bottom-0 left-0 right-0 bg-transparent p-4 flex justify-center">
    <button id="add-project-btn"
      class="bg-blue-600 hover:bg-blue-700 text-white rounded-full w-10 h-10 flex items-center justify-center text-2xl transition-all duration-300 hover:scale-110">+</button>
  </div>

  <!-- 创建项目模态窗口 -->
  <div id="create-modal"
    class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 transition-opacity duration-300">
    <div
      class="bg-[#1B1E1F] p-6 rounded-lg shadow-lg w-full max-w-md transform transition-transform duration-300 scale-95">
      <h2 class="text-2xl font-bold mb-4">Create New Project</h2>
      <!-- 预览区域 -->
      <div id="preview" class="mb-4 flex p-4 bg-[#2B2F31] rounded-lg">
        <img id="preview-avatar" src="" class="w-24 h-24 mb-2 bg-white mr-3">
        <div class="flex flex-col">
          <h3 id="preview-name" class="text-xl font-bold break-words"></h3>
          <p id="preview-description" class="break-words "></p>
          <div>
            <p id="preview-create-at" class="text-gray-400 text-xs">Created: xxxx-xx-xx 00:00:00</p>
            <p id="preview-update-at" class="text-gray-400 text-xs">Updated: xxxx-xx-xx 00:00:00</p>
          </div>
        </div>
      </div>
      <form id="create-project-form">
        <div class="mb-4">
          <label for="project-name" class="block text-sm font-medium mb-2">Project Name</label>
          <input type="text" id="project-name" name="project_name" required maxlength="50"
            class="w-full px-3 py-2 bg-[#2B2F31] border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-4">
          <label for="project-avatar" class="block text-sm font-medium mb-2">Project Avatar</label>
          <input type="file" id="project-avatar" accept="image/*"
            class="w-full px-3 py-2 bg-[#2B2F31] border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
        </div>
        <div class="mb-4">
          <label for="project-description" class="block text-sm font-medium mb-2">Description</label>
          <textarea id="project-description" name="project_description" rows="3" maxlength="200"
            class="w-full px-3 py-2 bg-[#2B2F31] border border-gray-600 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
        </div>
        <div class="flex space-x-4">
          <button type="submit"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Create</button>
          <button type="button" id="cancel-create"
            class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">Cancel</button>
        </div>
      </form>
    </div>
  </div>


  
  
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';
      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }
    });
  </script>
</body>

</html>
