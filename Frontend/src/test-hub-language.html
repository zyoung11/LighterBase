<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Language Test</title>
    <script src="../modules/i18n.ts"></script>
</head>
<body>
    <h1 data-i18n="hub.slogan.build">Build in a Lighter Way</h1>
    <h2 data-i18n="hub.slogan.minutes">Just in minutes</h2>
    <p data-i18n="hub.slogan.platform">Lighterbase is the Postgres development platform.</p>
    <p data-i18n="hub.slogan.editing">Backend editing in a new way than the past altogether.</p>
    <button data-i18n="hub.buttons.getStart">Get Start</button>
    <p data-i18n="hub.footer.trusted">Trusted by ourselves</p>
    <div data-i18n="hub.footer.github">LighterBase</div>
    <a href="#" data-i18n="hub.footer.icp">京公网安备11011402055062号</a>
    
    <button id="language-switcher">切换语言</button>
    
    <script>
        // 翻译页面函数
        function translatePage() {
            const elements = document.querySelectorAll('[data-i18n]');
            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');
                if (key) {
                    element.textContent = i18n.t(key);
                }
            });
        }
        
        // 监听语言变化事件
        window.addEventListener('languageChanged', translatePage);
        
        // 初始化翻译
        translatePage();
        
        // 手动切换语言测试
        document.getElementById('language-switcher').addEventListener('click', () => {
            i18n.toggleLanguage();
        });
    </script>
</body>
</html>
