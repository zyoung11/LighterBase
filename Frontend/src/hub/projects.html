<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/logoWhite.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
  <style>
    .line-clamp-3 {
      overflow: hidden;
      display: -webkit-box;
      -webkit-box-orient: vertical;
      -webkit-line-clamp: 3;
    }
  </style>
</head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">

  <div id="app" class="overflow-y-auto">
    <!-- Grid container will be generated here -->
  </div>





  <!-- 底部栏 -->
  <div class="fixed bottom-0 left-0 right-0 bg-transparent p-4 flex justify-center">
    <button id="add-project-btn"
      class="bg-blue-600 hover:bg-blue-700 text-white rounded-full w-10 h-10 flex items-center justify-center text-2xl transition-all duration-300 hover:scale-110">+</button>
  </div>

  <!-- 创建项目模态窗口 -->
  <div id="create-modal"
    class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center z-50 transition-opacity duration-300">
    <div
      class="bg-[#1B1E1F] p-3 rounded-lg shadow-lg w-[35%] h-[40%] transform transition-transform duration-300 scale-95">
      <h2 class="text-2xl font-bold mb-4">Create New Project</h2>
      <!-- 预览区域 -->
      <div id="preview" class="w-full h-[70%] mb-4 p-3 bg-[#2B2F31] rounded-lg">
        <div class="flex items-start h-full">
          <div class="flex flex-col items-center mr-6">
            <img id="preview-avatar" class="w-[20vh] h-[20vh] bg-white cursor-pointer rounded"
              onerror="this.src='../icons/projectsDefault.jpg'">
            <p class="text-gray-400 text-xs mt-2">点击上传图片</p>
          </div>
          <div class="flex flex-1 flex-col h-full">
            <input id="preview-name"
              class="text-xl font-bold break-words bg-transparent border-none outline-none text-white mb-2"
              placeholder="项目名称" maxlength="20">
            <textarea id="preview-description"
              class="flex-1 bg-transparent border-none outline-none text-white resize-none" placeholder="项目描述"
              maxlength="200"></textarea>
          </div>
        </div>
      </div>
      <form id="create-project-form">
        <input type="file" id="project-avatar" accept="image/*" class="hidden">
        <div class="flex space-x-4">
          <button type="submit"
            class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Create</button>
          <button type="button" id="cancel-create"
            class="flex-1 bg-gray-600 hover:bg-gray-700 text-white font-bold py-2 px-4 rounded">Cancel</button>
        </div>
      </form>
    </div>
  </div>


  <script src="hubConponents.ts"></script>
  <script src="projectTool.ts"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';
      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }
    });
  </script>
</body>

</html>
