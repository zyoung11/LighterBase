<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../icons/logoWhite.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="bg-[#121414] text-gray-200 min-h-screen flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">

  <header class="p-6 flex justify-between items-center border-b border-white/10 bg-[#1B1E1F]/80 backdrop-blur-md">
    <div class="flex items-center space-x-4">
      <img src="../icons/logoWhite.png" class="w-8 h-8" alt="logo">
      <h1 class="text-2xl font-bold text-[#46A3FF]">Admin Panel</h1>
    </div>
    <a href="/hub" class="text-gray-400 hover:text-white transition-colors">Back to Hub</a>
  </header>

  <main class="flex-1 p-8 max-w-6xl mx-auto w-full">
    <div class="bg-[#1B1E1F] border border-white/10 rounded-xl overflow-hidden shadow-2xl">
      <div class="p-6 border-b border-white/10 flex justify-between items-center">
        <h2 class="text-xl font-semibold">User Management</h2>
        <button id="refreshBtn"
          class="px-4 py-2 bg-[#46A3FF] hover:bg-[#2E96FF] rounded-lg text-sm transition-colors">Refresh List</button>
      </div>

      <div class="overflow-x-auto">
        <table class="w-full text-left">
          <thead class="bg-white/5 text-gray-400 uppercase text-xs">
            <tr>
              <th class="px-6 py-4">ID</th>
              <th class="px-6 py-4">User</th>
              <th class="px-6 py-4">Email</th>
              <th class="px-6 py-4">Created At</th>
              <th class="px-6 py-4 text-right">Actions</th>
            </tr>
          </thead>
          <tbody id="userTableBody" class="divide-y divide-white/5">
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="../hubUtils/admin.ts"></script>
  <script src="../hubUtils/hubConponents.ts"></script>
</body>

</html>
