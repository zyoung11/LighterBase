<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../icons/logoWhite.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    /* 自定义滚动条 */
    .custom-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .custom-scroll::-webkit-scrollbar-track {
      background: transparent;
    }

    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="fouc-fix bg-[#121414] text-gray-200 h-screen flex flex-col overflow-hidden"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">

  <div class="flex flex-1 overflow-hidden relative">
    <div class="absolute left-1/2 top-10 bottom-10 w-[1px] bg-white/30 -translate-x-1/2"></div>

    <div class="w-1/2 flex flex-col p-8 overflow-y-auto">
      <div class="relative mb-10 flex flex-col items-center">
        <h1 class="text-xl font-semibold text-white tracking-wide">Received</h1>
        <div class="flex items-center cursor-pointer group space-x-2" id="filter-received-btn">
          <span id="received-current-status" class="font-light">All</span>
          <span class="text-xs text-gray-400 transition-transform duration-200 group-hover:translate-y-0.5">▼</span>
        </div>
        <div id="filter-received-menu"
          class="hidden absolute top-20 bg-white/10 backdrop-blur-md border border-white/10 rounded-lg shadow-2xl z-20 w-32 overflow-hidden text-center">
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="all">All</div>
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="pending">Pending</div>
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="agree">Agree</div>
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="disagree">Disagree</div>
        </div>
      </div>
      <div id="received-list" class="space-y-4"></div>
    </div>

    <div class="w-1/2 flex flex-col p-8 overflow-y-auto">
      <div class="relative mb-10 flex flex-col items-center">
        <div class="flex items-center space-x-4">
          <h1 class="text-xl font-semibold text-white tracking-wide">Invited</h1>
          <button id="add-invite-btn"
            class="w-8 h-8 rounded-full border border-white/30 flex items-center justify-center hover:bg-white/10 transition text-white">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
              </path>
            </svg>
          </button>
        </div>
        <div class="flex items-center cursor-pointer group space-x-2" id="filter-invited-btn">
          <span id="invited-current-status" class="font-light">All</span>
          <span class="text-xs text-gray-400 transition-transform duration-200 group-hover:translate-y-0.5">▼</span>
        </div>

        <div id="filter-invited-menu"
          class="hidden absolute top-20 bg-white/10 backdrop-blur-md border border-white/10 rounded-lg shadow-2xl z-20 w-32 overflow-hidden text-center">
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="all">All</div>
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="pending">Pending</div>
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="agree">Agree</div>
          <div class="hover:bg-[#46A3FF] p-2 text-sm cursor-pointer transition" data-status="disagree">Disagree</div>
        </div>

        <div id="project-selector-menu"
          class="hidden absolute top-14 left-1/2 -translate-x-1/2 bg-[#1B1E1F] border border-white/20 rounded-lg shadow-2xl z-30 w-64 max-h-60 overflow-y-auto custom-scroll">
        </div>
      </div>
      <div id="invited-list" class="space-y-4"></div>
    </div>
  </div>

  <div id="modal-overlay"
    class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-[100] flex items-center justify-center">
    <div id="central-invite-modal"
      class="bg-[#1B1E1F] border border-white/20 rounded-xl shadow-2xl w-[500px] p-6 relative">
      <button id="close-modal-btn" class="absolute top-4 right-4 text-gray-400 hover:text-white">✕</button>

      <div id="modal-project-block"
        class="bg-white/5 border border-white/10 rounded-lg p-4 grid grid-cols-[120px_1fr] gap-4 mb-6">
        <img id="modal-proj-img" src="" class="w-[120px] h-[120px] object-cover rounded shadow-lg">
        <div class="flex flex-col justify-between overflow-hidden">
          <div>
            <h3 id="modal-proj-name" class="text-white font-bold truncate text-lg"></h3>
            <p id="modal-proj-desc" class="text-gray-400 text-sm line-clamp-2 mt-1"></p>
          </div>
          <div class="text-[10px] text-gray-500">
            <p id="modal-proj-created"></p>
            <p id="modal-proj-updated"></p>
          </div>
        </div>
      </div>

      <div class="space-y-4">
        <div class="flex items-center justify-center">
          <label class="block text-white mr-2">权限</label>
          <select id="modal-invite-permission"
            class="flex-1 bg-[#1B1E1F] border border-white/10 text-white p-2 rounded">
            <option value="readonly">readonly</option>
            <option value="admin">high-privileges</option>
          </select>
        </div>
        <div class="flex">
          <label class="block text-white mr-2">邮箱</label>
          <input type="email" id="modal-invite-email"
            class="flex-1 bg-[#1B1E1F] border border-white/10 text-white p-2 rounded focus:outline-none focus:ring-0"
            placeholder="输入邮箱">
        </div>
        <button id="modal-send-btn" class="bg-white text-black px-4 py-2 rounded w-full">发送</button>
      </div>
    </div>
  </div>

  <script src="./hubConponents.ts"></script>
  <script src="./messages.ts"></script>
</body>

</html>
