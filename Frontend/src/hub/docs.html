<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/LOGOW.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">

  <!-- 顶部导航栏 -->
  <nav class="flex justify-between items-center px-6 py-2 bg-[#181A1B]">
    <!-- 左侧：Logo、名称、Pricing、Docs -->
    <div class="flex items-center space-x-4">
      <a href="hub.html" class="flex items-center space-x-3">
        <img src="../icons/LOGOW.png" alt="Logo" class="w-8 h-8">
        <span class="text-xl font-bold">LighterBase</span>
      </a>
      <a href="pricing.html"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors inline-block">Pricing</a>
      <a href="docs.html"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors inline-block">Docs</a>
    </div>
    <!-- 右侧：Login in 或 用户名 -->
    <div class="relative">
      <a id="user-link" href="login.html"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] text-[#46A3FF] rounded-lg transition-colors inline-block">Login
        in</a>
      <div id="logout-menu" class="absolute top-full mt-1 bg-[#2B2F31] rounded-lg shadow-lg hidden z-10">
        <button id="logout-btn" class="px-4 py-2 text-white hover:bg-[#3a3f41] rounded-lg w-16 text-center">登出</button>
      </div>
    </div>
  </nav>

  <!-- 中间内容 -->
  <div class="w-full h-full flex overflow-hidden justify-center">
    <!-- 左侧侧边栏 -->
    <aside class="w-1/6 h-full bg-[#181A1B] p-4 ">
      <ul class="space-y-2">
        <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded text-lg font-semibold" data-section="intro">介绍</a>
        </li>
        <li>
          <a href="#" class="block p-2 hover:bg-[#2B2F31] rounded text-lg font-semibold" data-section="install">库调用</a>
          <ul class="ml-4 space-y-1" id="install-submenu">
            <li><a href="#install-create-section"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">创建</a></li>
            <li><a href="#install-delete-section"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">删除</a></li>
            <li><a href="#install-update-section"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">更新</a></li>
            <li><a href="#install-search-section"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">查询</a></li>
          </ul>
        </li>
        <!-- <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded text-lg font-semibold" -->
        <!-- data-section="api-reference">API 参考</a></li> -->
        <li>
          <a href="#" class="block p-2 hover:bg-[#2B2F31] rounded text-lg font-semibold" data-section="tutorials">教程</a>
          <ul class="ml-4 space-y-1" id="tutorials-submenu">
            <li><a href="#database-management"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">数据库管理</a></li>
            <li><a href="#log-management"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">日志管理</a></li>
            <li><a href="#file-management"
                class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">文件管理</a></li>
            <li><a href="#settings" class="block p-2 pl-4 hover:bg-[#2B2F31] rounded text-base font-medium">设置</a></li>
          </ul>
        </li>
      </ul>
    </aside>

    <!-- 中间显示区域 -->
    <main class="w-[65%] overflow-y-auto p-8 relative">
      <div id="content">
        <section id="intro" class="content-section">
          <div id="intro-cont"></div>
        </section>
        <section id="install" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">使用</h2>
          <div id="install-intro"></div>
          <div id="install-create-section" class="mb-6">
            <div id="install-create"></div>
          </div>
          <div id="install-delete-section" class="mb-6">
            <div id="install-delete"></div>
          </div>
          <div id="install-update-section" class="mb-6">
            <div id="install-update"></div>
          </div>
          <div id="install-search-section" class="mb-6">
            <div id="install-search"></div>
          </div>
        </section>
        <section id="api-reference" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">API 参考</h2>
          <p class="mb-4">面向开发者的详细 API 文档。</p>
          <p>更多详情在这里...</p>
        </section>
        <section id="tutorials" class="content-section hidden">
          <div id="tutorials-cont"></div>
        </section>
      </div>
      <!-- 底部导航按钮 -->
      <div class="flex justify-between items-center px-6 py-4">
        <button id="prev-btn"
          class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors">上一页</button>
        <button id="next-btn"
          class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors">下一页</button>
      </div>
    </main>


  </div>


  <script src="../utils/hubDoc.ts"></script>
  <script>
    const sections = ['intro', 'install', 'api-reference', 'tutorials'];
    let currentSection = 'intro';

    function showSection(sectionId) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
      currentSection = sectionId;

      // Remove highlight from all main links
      document.querySelectorAll('aside a[data-section]').forEach(link => link.classList.remove('bg-[#3a3f41]'));
      // Add highlight to current section link
      const currentLink = document.querySelector(`aside a[data-section="${sectionId}"]`);
      if (currentLink) {
        currentLink.classList.add('bg-[#3a3f41]');
      }

      // Scroll to top
      const main = document.querySelector('main');
      if (sectionId === 'install') {
        // Scroll to top of install section
        const element = document.getElementById('install');
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      } else if (sectionId === 'tutorials') {
        // Scroll to top of tutorials section
        const element = document.getElementById('tutorials');
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      }
    }

    // 侧边栏点击
    document.querySelectorAll('aside:first-of-type a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const section = e.target.dataset.section;
        if (section) {
          showSection(section);
        }
      });
    });



    // 上一页
    document.getElementById('prev-btn').addEventListener('click', () => {
      const index = sections.indexOf(currentSection);
      if (index > 0) {
        showSection(sections[index - 1]);
      }
    });

    // 下一页
    document.getElementById('next-btn').addEventListener('click', () => {
      const index = sections.indexOf(currentSection);
      if (index < sections.length - 1) {
        showSection(sections[index + 1]);
      }
    });

    // 初始化显示 intro
    showSection('intro');
    // Initial highlight
    const introLink = document.querySelector('aside a[data-section="intro"]');
    if (introLink) {
      introLink.classList.add('bg-[#3a3f41]');
    }
  </script>
  <script>
    // 检查登录状态
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    const token = getCookie('hubAuthToken');
    const username = localStorage.getItem('username');
    const userLink = document.getElementById('user-link');
    const logoutMenu = document.getElementById('logout-menu');
    const logoutBtn = document.getElementById('logout-btn');

    if (token && username) {
      userLink.textContent = username;
      userLink.href = '#';

      // 点击用户名显示/隐藏登出菜单
      userLink.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        logoutMenu.classList.toggle('hidden');
      });

      // 点击登出清除token
      logoutBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        document.cookie = 'hubAuthToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT;';
        localStorage.removeItem('username');
        window.location.reload();
      });

      // 点击其他地方隐藏菜单
      document.addEventListener('click', function (e) {
        if (!userLink.contains(e.target) && !logoutMenu.contains(e.target)) {
          logoutMenu.classList.add('hidden');
        }
      });
    }
  </script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';
      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }

      // Response button click handlers
      document.addEventListener('click', function (e) {
        if (e.target.classList.contains('response-btn')) {
          const status = e.target.getAttribute('data-status');
          const bar = e.target.closest('.response-btn-bar');
          const box = bar.nextElementSibling;

          // Remove active class from all buttons in this bar
          bar.querySelectorAll('.response-btn').forEach(btn => btn.classList.remove('active', 'bg-[#DCEEF3]'));
          bar.querySelectorAll('.response-btn').forEach(btn => btn.classList.add('bg-gray-300', 'hover:bg-gray-400'));

          // Add active class to clicked button
          e.target.classList.add('active', 'bg-[#DCEEF3]');
          e.target.classList.remove('bg-gray-300', 'hover:bg-gray-400');

          // Hide all response contents in this box
          box.querySelectorAll('.response-content-item').forEach(item => item.classList.add('hidden'));

          // Show the corresponding content
          const content = box.querySelector(`[data-status-content="${status}"]`);
          if (content) {
            content.classList.remove('hidden');
          }
        }

        // Submenu link click handlers
        if (e.target.closest('#install-submenu a, #tutorials-submenu a')) {
          e.preventDefault();
          const target = e.target.getAttribute('href').substring(1);
          const main = document.querySelector('main');
          const element = document.getElementById(target);
          if (element) {
            main.scrollTop = element.offsetTop - main.offsetTop;
          }
        }
      });
    });
  </script>

</body>

</html>
