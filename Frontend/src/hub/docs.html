<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/logoWhite.png" />
  <title>LighterBase</title>
  <link rel="stylesheet" href="./vs2015.css">
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">
  <!-- 中间内容 -->
  <div class="w-full h-full flex overflow-hidden justify-center">
    <!-- 左侧侧边栏 -->
    <aside class="w-1/6 h-full bg-[#181A1B] p-4 ">
      <ul class="space-y-2">
        <li><a href="#" class="nav-link block p-2 hover:scale-105 transition-transform rounded text-lg font-semibold"
            data-section="intro"><span class="number text-gray-400">1</span> 介绍</a>
        </li>
        <li>
          <a href="#" class="nav-link block p-2 hover:scale-105 transition-transform rounded text-lg font-semibold"
            data-section="install"><span class="number text-gray-400">2</span> 库调用</a>
          <ul class="ml-4 space-y-1" id="install-submenu">
            <li><a href="#install-create-section"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform  rounded text-base font-medium"><span
                  class="number text-gray-400">2.1</span> 创建</a></li>
            <li><a href="#install-delete-section"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform rounded text-base font-medium"><span
                  class="number text-gray-400">2.2</span> 删除</a></li>
            <li><a href="#install-update-section"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform rounded text-base font-medium"><span
                  class="number text-gray-400">2.3</span> 更新</a></li>
            <li><a href="#install-search-section"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform rounded text-base font-medium"><span
                  class="number text-gray-400">2.4</span> 查询</a></li>
          </ul>
        </li>
        <!-- <li><a href="#" class="block p-2 hover:bg-[#2B2F31] rounded text-lg font-semibold" -->
        <!-- data-section="api-reference">API 参考</a></li> -->
        <li>
          <a href="#" class="nav-link block p-2 hover:scale-105 transition-transform rounded text-lg font-semibold"
            data-section="tutorials"><span class="number text-gray-400">3</span> 教程</a>
          <ul class="ml-4 space-y-1" id="tutorials-submenu">
            <li><a href="#database-management"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform rounded text-base font-medium"><span
                  class="number text-gray-400">3.1</span> 数据库管理</a></li>
            <li><a href="#log-management"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform rounded text-base font-medium"><span
                  class="number text-gray-400">3.2</span> 日志管理</a></li>
            <li><a href="#file-management"
                class="nav-link block p-2 pl-4 hover:scale-105 rounded transition-transform  text-base font-medium"><span
                  class="number text-gray-400">3.3</span> 文件管理</a></li>
            <li><a href="#settings"
                class="nav-link block p-2 pl-4 hover:scale-105 transition-transform rounded text-base font-medium"><span
                  class="number text-gray-400">3.4</span> 设置</a></li>
          </ul>
        </li>
      </ul>
    </aside>

    <!-- 中间显示区域 -->
    <main class="w-[65%] overflow-y-auto p-8 relative">
      <div id="content">
        <section id="intro" class="content-section">
          <div id="intro-cont"></div>
        </section>
        <section id="install" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">使用</h2>
          <div id="install-intro"></div>
          <div id="install-create-section" class="mb-6">
            <div id="install-create"></div>
          </div>
          <div id="install-delete-section" class="mb-6">
            <div id="install-delete"></div>
          </div>
          <div id="install-update-section" class="mb-6">
            <div id="install-update"></div>
          </div>
          <div id="install-search-section" class="mb-6">
            <div id="install-search"></div>
          </div>
        </section>
        <section id="api-reference" class="content-section hidden">
          <h2 class="text-2xl font-semibold mb-4">API 参考</h2>
          <p class="mb-4">面向开发者的详细 API 文档。</p>
          <p>更多详情在这里...</p>
        </section>
        <section id="tutorials" class="content-section hidden">
          <div id="tutorials-cont"></div>
        </section>
      </div>
      <!-- 底部导航按钮 -->
      <div class="flex justify-between items-center px-6 py-4">
        <button id="prev-btn"
          class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors">上一页</button>
        <button id="next-btn"
          class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors">下一页</button>
      </div>
    </main>


  </div>


  <script src="../hubUtils/hubDoc.ts"></script>
  <script src="../hubUtils/hubConponents.ts"></script>
  <script>
    const sections = ['intro', 'install', 'api-reference', 'tutorials'];
    let currentSection = 'intro';

    function showSection(sectionId, highlightParent = true) {
      document.querySelectorAll('.content-section').forEach(sec => sec.classList.add('hidden'));
      document.getElementById(sectionId).classList.remove('hidden');
      currentSection = sectionId;

      if (highlightParent) {
        // Remove highlight from all nav-links
        document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('underline'));
        // Add highlight to current section link
        const currentLink = document.querySelector(`aside a[data-section="${sectionId}"]`);
        if (currentLink) {
          currentLink.classList.add('underline');
        }
      }

      // Scroll to top
      const main = document.querySelector('main');
      if (sectionId === 'install') {
        // Scroll to top of install section
        const element = document.getElementById('install');
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      } else if (sectionId === 'tutorials') {
        // Scroll to top of tutorials section
        const element = document.getElementById('tutorials');
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      }
    }

    // 侧边栏点击
    document.querySelectorAll('aside:first-of-type a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const section = e.target.dataset.section;
        if (section) {
          // Remove highlight from all nav-links
          document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('underline'));
          // Add highlight to this link
          e.target.classList.add('underline');
          showSection(section);
        }
      });
    });



    // 上一页
    document.getElementById('prev-btn').addEventListener('click', () => {
      const index = sections.indexOf(currentSection);
      if (index > 0) {
        showSection(sections[index - 1]);
      }
    });

    // 下一页
    document.getElementById('next-btn').addEventListener('click', () => {
      const index = sections.indexOf(currentSection);
      if (index < sections.length - 1) {
        showSection(sections[index + 1]);
      }
    });

    // 初始化显示 intro
    showSection('intro');


    document.addEventListener('click', function (e) {
      if (e.target.classList.contains('response-btn')) {
        const status = e.target.getAttribute('data-status');
        const bar = e.target.closest('.response-btn-bar');
        const box = bar.nextElementSibling;

        // Remove active class from all buttons in this bar
        bar.querySelectorAll('.response-btn').forEach(btn => btn.classList.remove('active', 'bg-[#DCEEF3]'));
        bar.querySelectorAll('.response-btn').forEach(btn => btn.classList.add('bg-gray-300', 'hover:bg-gray-400'));

        // Add active class to clicked button
        e.target.classList.add('active', 'bg-[#DCEEF3]');
        e.target.classList.remove('bg-gray-300', 'hover:bg-gray-400');

        // Hide all response contents in this box
        box.querySelectorAll('.response-content-item').forEach(item => item.classList.add('hidden'));

        // Show the corresponding content
        const content = box.querySelector(`[data-status-content="${status}"]`);
        if (content) {
          content.classList.remove('hidden');
        }
      }

      // Submenu link click handlers
      if (e.target.closest('#install-submenu a')) {
        e.preventDefault();
        const target = e.target.getAttribute('href').substring(1);
        // 确保切换到 install section
        if (currentSection !== 'install') {
          showSection('install', false);
        }
        // Remove highlight from all nav-links
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('underline'));
        // Add highlight to clicked link
        e.target.classList.add('underline');
        // 滚动到对应锚点
        const main = document.querySelector('main');
        const element = document.getElementById(target);
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      } else if (e.target.closest('#tutorials-submenu a')) {
        e.preventDefault();
        const target = e.target.getAttribute('href').substring(1);
        // 确保切换到 tutorials section
        if (currentSection !== 'tutorials') {
          showSection('tutorials', false);
        }
        // Remove highlight from all nav-links
        document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('underline'));
        // Add highlight to clicked link
        e.target.classList.add('underline');
        // 滚动到对应锚点
        const main = document.querySelector('main');
        const element = document.getElementById(target);
        if (element) {
          main.scrollTop = element.offsetTop - main.offsetTop;
        }
      }
    });
  </script>


</body>

</html>
