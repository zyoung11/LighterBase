<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" href="../icons/logoWhite.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }

    .square-btn {
      aspect-ratio: 1 / 1;
      width: 20%;
      max-width: 200px;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="fouc-fix bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">

  <!-- 顶部内容 -->
  <div class="flex-1 flex flex-col items-center justify-start  pt-16">
    <!-- Logo和标题 -->
    <div class="text-center space-y-4">
      <div class="flex items-center justify-center space-x-3">
        <img id="logoImg" alt="LighterBase Logo" class="w-16 h-16">
        <h1 class="text-5xl font-bold text-[#46A3FF]" data-i18n="download.title">LighterBase</h1>
      </div>
      <p class="text-xl text-gray-300" data-i18n="download.slogan">A Lighter way, a Lighter base, a Lighter life</p>
    </div>

    <!-- 操作按钮区域 -->
    <div class="flex space-x-[35vh] mt-16 mb-32">
      <button id="windowsBtn"
        class="w-[15vh] square-btn flex flex-col p-[6%] items-center space-y-2 bg-white rounded-lg">
        <img id="windowsImg" alt="Windows" class="w-[10vh]">
      </button>
      <button id="linuxBtn" class="w-[15vh] square-btn flex flex-col p-[6%] items-center space-y-2 bg-white rounded-lg">
        <img id="linuxImg" alt="Linux" class="w-[10vh]">
      </button>
    </div>

    <!-- 发布信息 -->
    <div class="w-full items-left mt-8 ml-16">
      <p class="text-lg ml-8 text-gray-300" data-i18n="download.release">2025.12.12 base officially released</p>
    </div>
  </div>

  <!-- 右下角联系信息 -->
  <div class="fixed bottom-8 right-8">
    <img id="contactLogoImg" alt="LighterBase" class="w-20 h-20">
    <span class="text-lg text-gray-400" data-i18n="download.contact">contact us</span>
  </div>

  <script src="download.ts"></script>
  <script src="hubConponents.ts"></script>
</body>

</html>
