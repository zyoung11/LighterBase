<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/LOGOW.png" />
  <title>Login - LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
      /* 增加渐变效果，更平滑 */
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="h-screen w-screen flex overflow-hidden bg-[#121414] text-gray-200">

  <!-- 左侧 70%：品牌区 -->
  <section class="w-[70%] flex items-center justify-center relative">
    <!-- 中央文案 -->
    <h1 class="text-3xl font-semibold tracking-wide select-none">
      欢迎使用 LighterBase
    </h1>
  </section>

  <!-- 右侧 30%：登录区 -->
  <aside class="w-[30%] bg-[#181A1B] flex items-center justify-center p-8 shadow-2xl relative">
    <!-- 返回按钮 -->
    <a href="hub"
      class="absolute top-4 right-4 px-3 py-1 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors text-sm">返回</a>
    <div class="w-full max-sm:max-w-sm">

      <!-- 上方 Login 字样 -->
      <h2 class="text-2xl font-bold mb-6 text-center">Login</h2>

       <!-- 登录表单 -->
       <form id="form-login" class="space-y-4">
         <div>
           <label class="block mb-1 text-sm">用户名</label>
           <input required id="login-username" type="text" placeholder="请输入用户名"
             class="w-full px-3 py-2 rounded bg-[#2B2F31] border border-[#2B2F31] focus:border-[#4a4f52] focus:outline-none" />
         </div>
         <div>
           <label class="block mb-1 text-sm">密码</label>
           <input required id="login-password" type="password" placeholder="请输入密码"
             class="w-full px-3 py-2 rounded bg-[#2B2F31] border border-[#2B2F31] focus:border-[#4a4f52] focus:outline-none" />
         </div>
         <div id="email-field">
           <label class="block mb-1 text-sm">邮箱</label>
           <input required id="email" type="email" placeholder="请输入邮箱"
             class="w-full px-3 py-2 rounded bg-[#2B2F31] border border-[#2B2F31] focus:border-[#4a4f52] focus:outline-none" />
         </div>
         <!-- 隐藏的注册输入 -->
         <input type="hidden" id="username">
         <input type="hidden" id="password">
         <button type="submit" class="w-full py-2 mt-2 rounded bg-[#2B2F31] hover:bg-[#3a3f41] transition-colors">
           登录
         </button>
       </form>

    </div>
  </aside>

  <script src="../utils/hubConponents.ts"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';

      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }
    });
  </script>
</body>

</html>
