<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/LOGOW.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col">
  <!-- 顶部导航栏 -->
  <nav class="flex justify-between items-center px-6 py-4 bg-[#181A1B]">
    <!-- 左侧：Logo、名称、Pricing、Docs -->
    <div class="flex items-center space-x-4">
      <a href="hub" class="flex items-center space-x-3">
        <img src="../icons/LOGOW.png" alt="Logo" class="w-8 h-8">
        <span class="text-xl font-bold">LighterBase</span>
      </a>
      <a href="pricing"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors inline-block">Pricing</a>
      <a href="docs"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] rounded-lg transition-colors inline-block">Docs</a>
    </div>
    <!-- 右侧：Login in -->
    <div>
      <a href="login"
        class="px-4 py-2 bg-[#2B2F31] hover:bg-[#3a3f41] text-[#46A3FF] rounded-lg transition-colors inline-block">Login
        in</a>
    </div>
  </nav>

  <!-- 中间内容 -->
  <div class="flex-1 flex items-center justify-center relative bg-[#121414]">
    <!-- Canvas for binary background -->
    <canvas id="binary-canvas" class="absolute inset-0 w-full h-full"></canvas>

    <!-- 扫描线 -->
    <div id="scan-line"
      class="absolute z-5 bg-[#46A3FF] opacity-50 h-1 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
    </div>

    <!-- 居中内容 -->
    <div id="center-text" class="text-center z-10 opacity-0 transform scale-y-0">
      <h1 class="text-8xl font-bold text-[#46A3FF] drop-shadow-lg">Totally Free!!</h1>
      <p class="text-xl mt-4 text-gray-300">Open and Efficent</p>
    </div>
  </div>

  <style>
    @keyframes scan {
      0% {
        width: 0;
        opacity: 0.4;
      }

      50% {
        width: 600px;
        opacity: 0.4;
      }

      /* Adjust to text width */
      100% {
        width: 600px;
        opacity: 0;
      }
    }

    @keyframes reveal {
      0% {
        opacity: 0;
        transform: scaleY(0);
      }

      100% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    #scan-line {
      animation: scan 2s ease-in-out forwards;
    }

    #center-text {
      animation: reveal 1s ease-in-out 2s forwards;
      transform-origin: center;
    }
  </style>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('binary-canvas');
      const ctx = canvas.getContext('2d');
      const chars = ['0', '1'];
      const fontSize = 16;
      const columns = Math.floor(window.innerWidth / fontSize);
      const rows = Math.floor(window.innerHeight / fontSize);
      const binaryArray = [];

      // Initialize canvas size
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Generate binary positions
      for (let i = 0; i < columns; i++) {
        for (let j = 0; j < rows; j++) {
          binaryArray.push({
            x: i * fontSize,
            y: j * fontSize,
            char: chars[Math.floor(Math.random() * chars.length)]
          });
        }
      }

      // Draw binary
      function drawBinary() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = `${fontSize}px monospace`;
        ctx.fillStyle = '#46A3FF';
        ctx.globalAlpha = 0.3;
        binaryArray.forEach(item => {
          ctx.fillText(item.char, item.x, item.y);
        });
      }
      drawBinary();

      // Mouse interaction
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      const radius = 150;

      function updateMask() {
        canvas.style.mask = `radial-gradient(circle ${radius}px at ${mouseX}px ${mouseY}px, black ${radius - 50}px, transparent ${radius}px)`;
        canvas.style.webkitMask = `radial-gradient(circle ${radius}px at ${mouseX}px ${mouseY}px, black ${radius - 50}px, transparent ${radius}px)`;
      }
      updateMask();

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        updateMask();
      });
    });
  </script>
  <audio id="bg-music" loop preload="auto">
    <source src="../musics/Free Bird.m4a" type="audio/mpeg">
    <!-- Fallback or placeholder -->
  </audio>
  <div id="music-control"
    class="fixed bottom-4 right-4 rounded-full bg-[#2B2F31] hover:bg-[#3a3f41] p-3 opacity-0 transition-opacity duration-500 shadow-lg">
    <button id="play-pause-btn" class="text-white text-2xl focus:outline-none">⏸️</button>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';
      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }

      const audio = document.getElementById('bg-music');
      const control = document.getElementById('music-control');
      const btn = document.getElementById('play-pause-btn');

      // Listen for text reveal animation end
      document.getElementById('center-text').addEventListener('animationend', () => {
        audio.play().catch(() => { }); // Play music, ignore errors if no src
        control.classList.add('opacity-100');
      });

      // Control button
      btn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          btn.textContent = '⏸️';
        } else {
          audio.pause();
          btn.textContent = '▶️';
        }
      });
    });
  </script>
</body>

</html>
