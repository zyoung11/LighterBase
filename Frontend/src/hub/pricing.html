<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../icons/LOGOW.png" />
  <title>LighterBase</title>
  <style id="fouc-fix">
    body {
      background: #1B1E1F;
      opacity: 0;
      transition: opacity 0.2s ease-in-out;
    }
  </style>
  <script src="../tailwind.js"></script>
</head>

<body class="bg-[#121414] text-gray-200 h-screen overflow-hidden flex flex-col"
  style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">


  <!-- 中间内容 -->
  <div class="flex-1 flex items-center justify-center relative bg-[#121414]"
    style="background-image: linear-gradient(rgba(255,255,255,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,0.05) 1px, transparent 1px); background-size: 20px 20px;">
    <!-- Canvas for binary background -->
    <canvas id="binary-canvas" class="absolute inset-0 w-full h-full"></canvas>

    <!-- 扫描线 -->
    <div id="scan-line"
      class="absolute z-5 bg-[#46A3FF] opacity-50 h-1 top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2">
    </div>

    <!-- 居中内容 -->
    <div id="center-text" class="text-center z-10 opacity-0 transform scale-y-0">
      <h1 class="text-8xl font-bold text-[#46A3FF] drop-shadow-lg">Totally Free!!</h1>
      <p class="text-xl mt-4 text-gray-300">Open and Efficent</p>
    </div>
  </div>

  <style>
    @keyframes scan {
      0% {
        width: 0;
        opacity: 0.4;
      }

      50% {
        width: 600px;
        opacity: 0.4;
      }

      100% {
        width: 600px;
        opacity: 0;
      }
    }

    @keyframes reveal {
      0% {
        opacity: 0;
        transform: scaleY(0);
      }

      100% {
        opacity: 1;
        transform: scaleY(1);
      }
    }

    #scan-line {
      animation: scan 2s ease-in-out forwards;
    }

    #center-text {
      animation: reveal 1s ease-in-out 2s forwards;
      transform-origin: center;
    }
  </style>

  <audio id="bg-music" loop preload="auto">
    <source src="../musics/Free Bird.m4a" type="audio/mpeg">
    <!-- Fallback or placeholder -->
  </audio>
  <div id="music-control"
    class="fixed bottom-4 right-4 rounded-full bg-[#2B2F31] hover:bg-[#3a3f41] p-3 opacity-0 transition-opacity duration-500 shadow-lg">
    <button id="play-pause-btn" class="text-white text-2xl focus:outline-none">⏸️</button>
  </div>
  <script src="../utils/hubConponents.ts"></script>
  <script>
    // 检查登录状态
    function getCookie(name) {
      const value = `; ${document.cookie}`;
      const parts = value.split(`; ${name}=`);
      if (parts.length === 2) return parts.pop().split(';').shift();
    }

    const token = getCookie('hubAuthToken');
    const username = localStorage.getItem('username');
    const userLink = document.getElementById('user-link');
    const logoutMenu = document.getElementById('logout-menu');
    const logoutBtn = document.getElementById('logout-btn');

    if (token && username) {
      userLink.textContent = username;
      userLink.href = '#';

      // 点击用户名显示/隐藏登出菜单
      userLink.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        logoutMenu.classList.toggle('hidden');
      });

      // 点击登出清除token
      logoutBtn.addEventListener('click', function (e) {
        e.stopPropagation();
        document.cookie = 'hubAuthToken=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT;';
        localStorage.removeItem('username');
        window.location.reload();
      });

      // 点击其他地方隐藏菜单
      document.addEventListener('click', function (e) {
        if (!userLink.contains(e.target) && !logoutMenu.contains(e.target)) {
          logoutMenu.classList.add('hidden');
        }
      });
    }

    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('binary-canvas');
      const ctx = canvas.getContext('2d');
      const chars = ['0', '1'];
      const fontSize = 16;
      const columns = Math.floor(window.innerWidth / fontSize);
      const rows = Math.floor(window.innerHeight / fontSize);
      const binaryArray = [];

      // Initialize canvas size
      function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resizeCanvas();
      window.addEventListener('resize', resizeCanvas);

      // Generate binary positions
      for (let i = 0; i < columns; i++) {
        for (let j = 0; j < rows; j++) {
          binaryArray.push({
            x: i * fontSize,
            y: j * fontSize,
            char: chars[Math.floor(Math.random() * chars.length)]
          });
        }
      }

      // Draw binary
      function drawBinary() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.font = `${fontSize}px monospace`;
        ctx.fillStyle = '#46A3FF';
        ctx.globalAlpha = 0.3;
        binaryArray.forEach(item => {
          ctx.fillText(item.char, item.x, item.y);
        });
      }
      drawBinary();

      // Mouse interaction
      let mouseX = window.innerWidth / 2;
      let mouseY = window.innerHeight / 2;
      const radius = 150;

      function updateMask() {
        canvas.style.mask = `radial-gradient(circle ${radius}px at ${mouseX}px ${mouseY}px, black ${radius - 50}px, transparent ${radius}px)`;
        canvas.style.webkitMask = `radial-gradient(circle ${radius}px at ${mouseX}px ${mouseY}px, black ${radius - 50}px, transparent ${radius}px)`;
      }
      updateMask();

      window.addEventListener('blur', () => {
        mouseX = window.innerWidth / 2;
        mouseY = window.innerHeight / 2;
        updateMask();
      });

      document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        updateMask();
      });
    });

    document.addEventListener('DOMContentLoaded', function () {
      document.body.style.opacity = '1';
      const styleTag = document.getElementById('fouc-fix');
      if (styleTag) {
        styleTag.remove();
      }

      const audio = document.getElementById('bg-music');
      const control = document.getElementById('music-control');
      const btn = document.getElementById('play-pause-btn');

      // Listen for text reveal animation end
      document.getElementById('center-text').addEventListener('animationend', () => {
        audio.play().catch(() => { }); // Play music, ignore errors if no src
        control.classList.add('opacity-100');
      });

      // Control button
      btn.addEventListener('click', () => {
        if (audio.paused) {
          audio.play();
          btn.textContent = '⏸️';
        } else {
          audio.pause();
          btn.textContent = '▶️';
        }
      });
    });
  </script>
</body>

</html>
