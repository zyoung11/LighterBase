<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Language Test</title>
    <style>
        body {
            background: #121414;
            color: #121414;
            font-family: Arial, sans-serif;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .pricing-container {
            text-align: center;
            background: #2B2F31;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }
        .title {
            font-size: 3em;
            color: #46A3FF;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .subtitle {
            font-size: 1.2em;
            color: #ccc;
            margin-bottom: 30px;
        }
        .music-control {
            margin-top: 30px;
        }
        .music-btn {
            background: #46A3FF;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.5em;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .music-btn:hover {
            background: #14AFF7;
            transform: scale(1.05);
        }
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #2B2F31;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="language-switcher" onclick="toggleLanguage()">切换语言</button>
    
    <div class="pricing-container">
        <h1 class="title" data-i18n="pricing.title.free">Totally Free!!</h1>
        <p class="subtitle" data-i18n="pricing.subtitle.efficient">Open and Efficent</p>
        
        <div class="music-control">
            <button class="music-btn" id="play-pause-btn" data-i18n="pricing.music.pause" onclick="toggleMusic()">⏸️</button>
        </div>
    </div>

    <script>
        // 模拟i18n功能
        const i18n = {
            currentLang: 'zh',
            translations: {
                zh: {
                    "pricing": {
                        "title": {
                            "free": "完全免费！！"
                        },
                        "subtitle": {
                            "efficient": "开放且高效"
                        },
                        "music": {
                            "play": "▶️",
                            "pause": "⏸️"
                        }
                    }
                },
                en: {
                    "pricing": {
                        "title": {
                            "free": "Totally Free!!"
                        },
                        "subtitle": {
                            "efficient": "Open and Efficent"
                        },
                        "music": {
                            "play": "▶️",
                            "pause": "⏸️"
                        }
                    }
                }
            },
            t: function(key) {
                const keys = key.split('.');
                let value = this.translations[this.currentLang];
                for (const k of keys) {
                    value = value?.[k];
                }
                return value || key;
            },
            toggleLanguage: function() {
                this.currentLang = this.currentLang === 'zh' ? 'en' : 'zh';
                this.updatePage();
            },
            updatePage: function() {
                const elements = document.querySelectorAll('[data-i18n]');
                elements.forEach(element => {
                    const key = element.getAttribute('data-i18n');
                    if (key) {
                        element.textContent = this.t(key);
                    }
                });
                
                // 特殊处理音乐控制按钮
                const playPauseBtn = document.getElementById('play-pause-btn');
                if (playPauseBtn) {
                    playPauseBtn.textContent = this.t('pricing.music.pause');
                }
            }
        };
        
        // 初始化页面
        i18n.updatePage();
        
        // 音乐播放状态
        let isPlaying = false;
        
        // 切换语言函数
        function toggleLanguage() {
            i18n.toggleLanguage();
        }
        
        // 切换音乐播放状态
        function toggleMusic() {
            const btn = document.getElementById('play-pause-btn');
            isPlaying = !isPlaying;
            
            if (isPlaying) {
                btn.textContent = i18n.t('pricing.music.play');
            } else {
                btn.textContent = i18n.t('pricing.music.pause');
            }
        }
    </script>
</body>
</html>
