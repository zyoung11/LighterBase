<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub Language Demo</title>
    <style>
        body {
            background: #1B1E1F;
            color: #121414;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .demo-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2B2F31;
            padding: 30px;
            border-radius: 10px;
        }
        .slogan {
            text-align: center;
            margin-bottom: 30px;
        }
        .slogan h1 {
            font-size: 2.5em;
            color: #46A3FF;
            margin-bottom: 10px;
        }
        .slogan h2 {
            font-size: 2em;
            margin-bottom: 10px;
        }
        .slogan p {
            font-size: 1.2em;
            margin-bottom: 10px;
        }
        .button {
            display: inline-block;
            padding: 12px 24px;
            background: #46A3FF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            margin: 10px 0;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9em;
            color: #888;
        }
        .language-switcher {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: #2B2F31;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <button class="language-switcher" onclick="toggleLanguage()">切换语言</button>
    
    <div class="demo-container">
        <div class="slogan">
            <h1 data-i18n="hub.slogan.build">Build in a Lighter Way</h1>
            <h2 data-i18n="hub.slogan.minutes">Just in minutes</h2>
            <p data-i18n="hub.slogan.platform">Lighterbase is the Postgres development platform.</p>
            <p data-i18n="hub.slogan.editing">Backend editing in a new way than the past altogether.</p>
        </div>
        
        <div style="text-align: center;">
            <a href="#" class="button" data-i18n="hub.buttons.getStart">Get Start</a>
        </div>
        
        <div class="footer">
            <p data-i18n="hub.footer.trusted">Trusted by ourselves</p>
            <div style="margin-top: 20px;">
                <span data-i18n="hub.footer.github">LighterBase</span>
            </div>
            <div style="margin-top: 10px;">
                <a href="#" data-i18n="hub.footer.icp">京公网安备11011402055062号</a>
            </div>
        </div>
    </div>

    <script>
        // 模拟i18n功能
        const i18n = {
            currentLang: 'zh',
            translations: {
                zh: {
                    "hub": {
                        "slogan": {
                            "build": "以更轻的方式构建",
                            "minutes": "只需几分钟",
                            "platform": "Lighterbase 是 Postgres 开发平台。",
                            "editing": "以后端编辑的新方式彻底改变过去。"
                        },
                        "buttons": {
                            "getStart": "开始使用"
                        },
                        "footer": {
                            "trusted": "我们自己信任",
                            "github": "LighterBase",
                            "icp": "京公网安备11011402055062号"
                        }
                    }
                },
                en: {
                    "hub": {
                        "slogan": {
                            "build": "Build in a Lighter Way",
                            "minutes": "Just in minutes",
                            "platform": "Lighterbase is the Postgres development platform.",
                            "editing": "Backend editing in a new way than the past altogether."
                        },
                        "buttons": {
                            "getStart": "Get Start"
                        },
                        "footer": {
                            "trusted": "Trusted by ourselves",
                            "github": "LighterBase",
                            "icp": "京公网安备11011402055062号"
                        }
                    }
                }
            },
            t: function(key) {
                const keys = key.split('.');
                let value = this.translations[this.currentLang];
                for (const k of keys) {
                    value = value?.[k];
                }
                return value || key;
            },
            toggleLanguage: function() {
                this.currentLang = this.currentLang === 'zh' ? 'en' : 'zh';
                this.updatePage();
            },
            updatePage: function() {
                const elements = document.querySelectorAll('[data-i18n]');
                elements.forEach(element => {
                    const key = element.getAttribute('data-i18n');
                    if (key) {
                        element.textContent = this.t(key);
                    }
                });
            }
        };
        
        // 初始化页面
        i18n.updatePage();
        
        // 切换语言函数
        function toggleLanguage() {
            i18n.toggleLanguage();
        }
    </script>
</body>
</html>
